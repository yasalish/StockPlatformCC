# conf.d/boursenegar.conf — the public server blocks.
#
# server_name is the catch-all `_` and every redirect uses $host, so this file
# needs no templating and no rebuild when the domain changes: point DNS at the
# VPS, drop the matching certificate into the tls volume, and reload.

# ---------------------------------------------------------------------------
# :80 — redirect to HTTPS, with two deliberate exceptions.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The container healthcheck runs inside the container and must not be sent
    # on a 301 to a certificate it has no reason to trust.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Left open for an ACME http-01 challenge. Certbot is not part of this
    # stack (it would need outbound reachability to the CA, which is not
    # guaranteed from Iran), but the webroot is here so adding it later is a
    # compose change and nothing more.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# :443 — the application.
# ---------------------------------------------------------------------------
server {
    # `http2` as a listen parameter is correct for the nginx this image ships,
    # Debian bookworm's 1.22.1. The standalone `http2 on;` directive that
    # replaces it did not exist until 1.25.1, and using it here would be a
    # startup error. Newer nginx still accepts this form but warns; if the base
    # image is ever moved past 1.25, drop `http2` from both listen lines and add
    # `http2 on;` on its own line below.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    include /etc/nginx/snippets/tls.conf;

    # ---------------------------------------------------------------------
    # C-1: re-resolve the application's name so scaled replicas are reached.
    # ---------------------------------------------------------------------
    # 127.0.0.11 is Docker's embedded DNS; inside a compose network it returns
    # one A record per replica of the `web` service, and nginx round-robins
    # across whatever it last resolved. `valid=10s` bounds how long a
    # scale-up or a replaced container takes to enter rotation.
    #
    # The name must go through a VARIABLE: a literal in proxy_pass is resolved
    # once at startup, which is the whole of finding C-1. ipv6=off because the
    # compose network is v4-only here and asking for AAAA just adds a failed
    # lookup to every resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $app_upstream "web:8000";
    include /etc/nginx/snippets/security-headers.conf;

    # One address may hold 20 simultaneous connections. The pages pull a
    # handful of assets in parallel, so this is well above normal use and well
    # below what a single client needs to exhaust the worker pool.
    limit_conn conn 20;

    root /srv/static;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # -----------------------------------------------------------------------
    # Static assets — served by nginx directly, never touching Gunicorn.
    #
    # The one-year immutable policy is the one order 00 established: the
    # templates already cache-bust with ?v=<file mtime> via asset_version(), so
    # a changed file arrives under a changed URL and an unchanged one never
    # needs revalidating. This is what replaced the old `no-store`, which
    # forbade even a 304 and re-downloaded ~45 kB on every navigation.
    #
    # /app/static (in the web container) and /srv/static (here) are the SAME
    # host directory, bind-mounted into both — so the mtime the template stamps
    # into the URL always matches the file nginx serves.
    # -----------------------------------------------------------------------
    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        # Pre-compressed .br / .gz siblings are used when present.
        brotli_static on;
        gzip_static   on;
        try_files $uri =404;
    }

    location = /favicon.ico {
        alias /srv/static/favicon.ico;
        access_log off;
        expires 30d;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # Container probes — unmetered and unlogged, or the healthcheck itself
    # would fill the access log and eventually trip the rate limiter.
    # -----------------------------------------------------------------------
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/proxy-web.conf;
        proxy_pass http://$app_upstream;
    }

    location = /readyz {
        access_log off;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/proxy-web.conf;
        proxy_pass http://$app_upstream;
    }

    # -----------------------------------------------------------------------
    # Credential endpoints — FLOOD protection only (finding H-7).
    #
    # This used to be the app's only defence against password guessing, at
    # 12r/m per address. That is unusable behind carrier NAT, where one address
    # is thousands of people, and useless against a distributed attempt, which
    # spreads across addresses. Guessing is now stopped per-account in Redis by
    # auth.py; what is left here is a ceiling on volume, sized so a shared
    # carrier address never reaches it. The generous burst is deliberate: a
    # market-open rush of real logins from one NAT should queue, not 429.
    # -----------------------------------------------------------------------
    location ~ ^/(login|register|auth/) {
        limit_req zone=login burst=40 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/proxy-web.conf;
        proxy_pass http://$app_upstream;
    }

    # -----------------------------------------------------------------------
    # Cached analytics documents (finding C-2)
    # -----------------------------------------------------------------------
    # These five prefixes return the SAME BYTES to every caller between daily
    # data updates. Serving them from nginx's memory instead of from Python is
    # the largest single capacity gain available to this deployment.
    #
    # The prefix list is explicit, and deliberately so. /api/ also carries
    # per-user endpoints — /api/watchlist/keys above all — and a blanket
    # `location /api/` with proxy_cache on would serve one account's watchlist
    # to the next caller. Adding a new cacheable endpoint here should be a
    # decision, not something that happens by URL accident.
    #
    # ON PURGING. The review asks for the cache to be purged when
    # cache.bump_version() fires. Open-source nginx has no proxy_cache_purge —
    # that directive is nginx-plus or the third-party ngx_cache_purge module,
    # and adding a compiled module to this image would reintroduce exactly the
    # build-from-GitHub fragility the Dockerfile header rejects for brotli.
    #
    # A short TTL gets the same result here, because the underlying data changes
    # ONCE A DAY: at 60 seconds, a data update is visible within a minute and
    # the market-open spike still collapses to one origin render per minute per
    # document instead of one per request. `updating` in proxy_cache_use_stale
    # plus proxy_cache_lock means the single request that does go to Python
    # never has company, and everyone else keeps reading the slightly-old copy
    # rather than queueing. If exact invalidation is wanted later, the honest
    # options are ngx_cache_purge or putting the data version in the URL.
    location ~ ^/api/(market|performance|scan|screener|heatmap|breadth|indices)/ {
        limit_req zone=perip burst=40 nodelay;

        proxy_cache api;
        # Path AND query string: `?as_of=` selects a different trading day and
        # must be a different entry. NOTHING user-specific is in the key —
        # no cookie, no Authorization — which is only safe because H-1 removed
        # the per-user field from these payloads.
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 60s;
        proxy_cache_valid 404 10s;
        # One origin request per key while a fill is in flight. The application
        # already does this internally (cache.py's single-flight lock); this is
        # the same idea one layer out, so a cold key at 09:00 does not become
        # 6,000 simultaneous renders.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        # Prefer a slightly stale document over an error or a wait. This is what
        # keeps the site readable through an origin restart.
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        # The app sends `Set-Cookie` for the session on some responses; without
        # this nginx refuses to cache any of them. Safe here precisely because
        # these documents contain nothing about the caller.
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;

        # Observability: HIT / MISS / EXPIRED / UPDATING / STALE, so the effect
        # of this block is measurable rather than assumed.
        add_header X-Cache-Status $upstream_cache_status always;
        include /etc/nginx/snippets/security-headers.conf;

        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/proxy-web.conf;
        proxy_pass http://$app_upstream;
    }

    # -----------------------------------------------------------------------
    # Per-user API endpoints — NEVER cached.
    # -----------------------------------------------------------------------
    # /api/watchlist/keys is the other half of H-1: the small, genuinely
    # per-person document the shared payloads above were split away from. It is
    # listed explicitly, before the generic handler, so that no future change to
    # the block above can start caching it by accident.
    # -----------------------------------------------------------------------
    location ~ ^/api/(watchlist|designer/filters|alerts) {
        limit_req zone=perip burst=40 nodelay;
        proxy_cache off;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/proxy-web.conf;
        proxy_pass http://$app_upstream;
    }

    # -----------------------------------------------------------------------
    # WebSocket endpoint, reserved for the streaming service in the plan.
    # Nothing serves /ws/ today; it is here so that adding it later requires no
    # nginx change. It differs from the ordinary proxy in the two ways a socket
    # needs: buffering off (a buffered stream is not a stream) and timeouts
    # measured in hours rather than the 60 s a page render gets.
    # -----------------------------------------------------------------------
    location /ws/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://$app_upstream;
        # Deliberately NOT including proxy-web.conf: a buffered stream is
        # not a stream. This is the reason buffering lives in its own snippet.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # -----------------------------------------------------------------------
    # Everything else → Gunicorn.
    #
    # 20 r/s sustained with a burst of 40. `nodelay` lets the burst through at
    # full speed instead of queueing it, which is what a page load looks like:
    # a short cluster of requests, then nothing.
    # -----------------------------------------------------------------------
    location / {
        limit_req zone=perip burst=40 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/proxy-web.conf;
        proxy_pass http://$app_upstream;
    }

    # Persian error pages would be nicer, but a 502 means the app is down and
    # cannot render one. Keep nginx's own.
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        root /usr/share/nginx/html;
    }
}

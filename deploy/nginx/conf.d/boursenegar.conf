# conf.d/boursenegar.conf — the public server blocks.
#
# server_name is the catch-all `_` and every redirect uses $host, so this file
# needs no templating and no rebuild when the domain changes: point DNS at the
# VPS, drop the matching certificate into the tls volume, and reload.

# ---------------------------------------------------------------------------
# :80 — redirect to HTTPS, with two deliberate exceptions.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The container healthcheck runs inside the container and must not be sent
    # on a 301 to a certificate it has no reason to trust.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Left open for an ACME http-01 challenge. Certbot is not part of this
    # stack (it would need outbound reachability to the CA, which is not
    # guaranteed from Iran), but the webroot is here so adding it later is a
    # compose change and nothing more.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# :443 — the application.
# ---------------------------------------------------------------------------
server {
    # `http2` as a listen parameter is correct for the nginx this image ships,
    # Debian bookworm's 1.22.1. The standalone `http2 on;` directive that
    # replaces it did not exist until 1.25.1, and using it here would be a
    # startup error. Newer nginx still accepts this form but warns; if the base
    # image is ever moved past 1.25, drop `http2` from both listen lines and add
    # `http2 on;` on its own line below.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # One address may hold 20 simultaneous connections. The pages pull a
    # handful of assets in parallel, so this is well above normal use and well
    # below what a single client needs to exhaust the worker pool.
    limit_conn conn 20;

    root /srv/static;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # -----------------------------------------------------------------------
    # Static assets — served by nginx directly, never touching Gunicorn.
    #
    # The one-year immutable policy is the one order 00 established: the
    # templates already cache-bust with ?v=<file mtime> via asset_version(), so
    # a changed file arrives under a changed URL and an unchanged one never
    # needs revalidating. This is what replaced the old `no-store`, which
    # forbade even a 304 and re-downloaded ~45 kB on every navigation.
    #
    # /app/static (in the web container) and /srv/static (here) are the SAME
    # host directory, bind-mounted into both — so the mtime the template stamps
    # into the URL always matches the file nginx serves.
    # -----------------------------------------------------------------------
    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        # Pre-compressed .br / .gz siblings are used when present.
        brotli_static on;
        gzip_static   on;
        try_files $uri =404;
    }

    location = /favicon.ico {
        alias /srv/static/favicon.ico;
        access_log off;
        expires 30d;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # Container probes — unmetered and unlogged, or the healthcheck itself
    # would fill the access log and eventually trip the rate limiter.
    # -----------------------------------------------------------------------
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/proxy-web.conf;
        proxy_pass http://boursenegar;
    }

    location = /readyz {
        access_log off;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/proxy-web.conf;
        proxy_pass http://boursenegar;
    }

    # -----------------------------------------------------------------------
    # Credential endpoints — 12 requests/minute per address, burst 5.
    # The threat here is guessing, not volume: a human logging in never trips
    # this, and a script trying a password list does so immediately.
    # -----------------------------------------------------------------------
    location ~ ^/(login|register|auth/) {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/proxy-web.conf;
        proxy_pass http://boursenegar;
    }

    # -----------------------------------------------------------------------
    # WebSocket endpoint, reserved for the streaming service in the plan.
    # Nothing serves /ws/ today; it is here so that adding it later requires no
    # nginx change. It differs from the ordinary proxy in the two ways a socket
    # needs: buffering off (a buffered stream is not a stream) and timeouts
    # measured in hours rather than the 60 s a page render gets.
    # -----------------------------------------------------------------------
    location /ws/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://boursenegar;
        # Deliberately NOT including proxy-web.conf: a buffered stream is
        # not a stream. This is the reason buffering lives in its own snippet.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # -----------------------------------------------------------------------
    # Everything else → Gunicorn.
    #
    # 20 r/s sustained with a burst of 40. `nodelay` lets the burst through at
    # full speed instead of queueing it, which is what a page load looks like:
    # a short cluster of requests, then nothing.
    # -----------------------------------------------------------------------
    location / {
        limit_req zone=perip burst=40 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/proxy-web.conf;
        proxy_pass http://boursenegar;
    }

    # Persian error pages would be nicer, but a 502 means the app is down and
    # cannot render one. Keep nginx's own.
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        root /usr/share/nginx/html;
    }
}

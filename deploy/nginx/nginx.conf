# nginx.conf — main configuration for بورس‌نگار.
# Server blocks live in conf.d/boursenegar.conf; reusable fragments in snippets/.

user  www-data;
# One worker per core. nginx workers are event-driven, so this is the whole
# story — unlike the Gunicorn behind it, they never block on PostgreSQL.
worker_processes  auto;
worker_rlimit_nofile 65535;

# Debian's packaging drops the brotli load_module lines here.
include /etc/nginx/modules-enabled/*.conf;

pid /run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not advertise the exact nginx version in headers or error pages.
    server_tokens off;

    charset       utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json;

    # ---------------------------------------------------------------------
    # I/O
    # ---------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;      # fill packets before sending — helps the 2.5 MB pages
    tcp_nodelay     on;      # …but don't delay the small ones
    types_hash_max_size 2048;

    # ---------------------------------------------------------------------
    # Timeouts and request limits
    #
    # This app accepts no uploads: the largest legitimate request body is the
    # JSON ticker list posted by the retry button, a few kilobytes. A 2 MB cap
    # is therefore already generous and closes off body-flood attempts, and the
    # slow header/body timeouts close Slowloris-style connections.
    # ---------------------------------------------------------------------
    client_max_body_size      2m;
    client_body_buffer_size   128k;
    client_body_timeout       15s;
    client_header_timeout     15s;
    send_timeout              30s;
    keepalive_timeout         65s;
    keepalive_requests        1000;
    large_client_header_buffers 4 16k;
    reset_timedout_connection on;

    # ---------------------------------------------------------------------
    # Rate limiting. Zones are declared here and applied per-location, so an
    # exhausted zone returns 429 rather than dropping the connection.
    #   perip  — ordinary page and API traffic
    #   login  — credential endpoints, where the threat is guessing, not volume
    #   conn   — caps a single address monopolising worker connections
    # 10m of state holds roughly 160k distinct addresses.
    # ---------------------------------------------------------------------
    limit_req_zone  $binary_remote_addr zone=perip:10m  rate=20r/s;
    # H-7. Was 12r/m, which is the wrong limit on the wrong key.
    #
    # Iranian mobile carriers place very large user populations behind shared
    # NAT addresses, so thousands of legitimate users can arrive as one
    # $binary_remote_addr. Twelve login attempts per minute for a whole carrier
    # locks out real customers at market open — while doing nothing about a
    # distributed guessing attempt, which never sends twelve requests from one
    # address anyway.
    #
    # Guessing is now handled where the account is known: auth.py keeps a
    # per-ACCOUNT failure counter in Redis with exponential backoff (five free
    # attempts, then 2s, 4s, 8s … capped at five minutes). That is the limit
    # that actually protects a password.
    #
    # This zone is left purely as flood protection — enough headroom that a
    # NATed carrier never notices it, low enough that a single address cannot
    # bury the login endpoint. 120r/m is ten times the old ceiling.
    limit_req_zone  $binary_remote_addr zone=login:10m  rate=120r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # ---------------------------------------------------------------------
    # حافظهٔ نهان لبه / edge cache for the shared API documents (C-2)
    # ---------------------------------------------------------------------
    # The review's single highest-leverage line. The analytics endpoints are
    # byte-identical for every user between daily data updates — db.py's cache
    # keys deliberately carry no user identity — yet every request travelled
    # the whole path into Python. At 100,000 users that is the difference
    # between one render per data update and millions.
    #
    # This became possible only after H-1: /api/market, /api/performance and
    # /api/scan each embedded the caller's watchlist, which made an otherwise
    # static document user-specific. The stars now come from
    # /api/watchlist/keys, which is `no-store` and never cached here.
    #
    # 20m of keys holds roughly 160k entries; 1g of body is far more than the
    # handful of megabytes these documents occupy, so `inactive` expires them
    # long before `max_size` ever evicts anything.
    proxy_cache_path /var/cache/nginx/api
                     levels=1:2
                     keys_zone=api:20m
                     max_size=1g
                     inactive=10m
                     use_temp_path=off;
    limit_req_status  429;
    limit_conn_status 429;

    # ---------------------------------------------------------------------
    # Logging — to stdout/stderr, so `docker compose logs -f nginx` is the one
    # place to look. $upstream_response_time separates "the app was slow" from
    # "the network was slow", which matters when chasing the [perf] warnings
    # app.py emits above 200 ms.
    # ---------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time '
                    'cache=$upstream_cache_status rid=$request_id';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ---------------------------------------------------------------------
    # Compression. The pages are enormous and highly repetitive Persian markup
    # (~2.5 MB for /stocks), so this is the single biggest transfer win —
    # especially over Iranian mobile networks.
    #
    # gzip stays enabled alongside brotli: brotli wins when the client advertises
    # `br`, and nginx falls back to gzip for anything that does not.
    # ---------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;      # so caches key on Accept-Encoding
    gzip_proxied      any;
    gzip_comp_level   5;       # 5 is the knee: ~level-9 ratio at a third of the CPU
    gzip_min_length   1024;
    gzip_disable      "msie6";
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/xml+rss application/rss+xml
        application/manifest+json image/svg+xml
        font/woff font/woff2 application/font-woff application/font-woff2;

    # brotli_static on serves a pre-built .br file when one sits next to the
    # asset, costing no CPU at all; brotli on compresses everything else live.
    brotli            on;
    brotli_static     on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/xml+rss application/rss+xml
        application/manifest+json image/svg+xml
        font/woff font/woff2;

    # NOTE: woff2 is already compressed internally — listing it above costs a
    # little CPU for almost no gain, but keeps the config honest if a plain
    # .woff or .ttf is ever added.

    # ---------------------------------------------------------------------
    # WebSocket readiness.
    #
    # There is no WebSocket endpoint today. This map exists so that when the
    # planned streaming service arrives, it needs no change here: an ordinary
    # HTTP request sends no Upgrade header and $connection_upgrade evaluates to
    # "close" (a plain keep-alive proxy), while an upgrade request evaluates to
    # "upgrade" and the same location tunnels it. Hard-coding
    # `Connection upgrade` instead would break every normal request.
    # ---------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---------------------------------------------------------------------
    # Upstream. `keepalive` holds idle connections open to Gunicorn so each
    # request avoids a TCP handshake; it requires HTTP/1.1 and an empty
    # Connection header, both set in snippets/proxy.conf.
    # ---------------------------------------------------------------------
    # -----------------------------------------------------------------------
    # The application upstream (finding C-1)
    # -----------------------------------------------------------------------
    # `server web:8000` is resolved ONCE, when nginx starts. That was fine with
    # exactly one application container and is the reason adding replicas would
    # have changed nothing: `docker compose up --scale web=6` starts six, and
    # nginx keeps sending every request to whichever IP it resolved at boot.
    #
    # Docker's embedded DNS at 127.0.0.11 returns an A record per replica, so
    # re-resolving is all that is needed — but open-source nginx only re-resolves
    # a name used through a VARIABLE in proxy_pass, never one in an `upstream`
    # block (that is `resolve` on a server line, which is nginx-plus). Hence the
    # $app_upstream indirection in conf.d/boursenegar.conf.
    #
    # WHAT THIS COSTS, STATED PLAINLY: keepalive to the upstream. A variable
    # proxy_pass cannot use an upstream block, and connection reuse to the
    # backend is an upstream-block feature. On a LAN between two containers a
    # fresh TCP connection is cheap (no TLS to the backend), and removing the
    # 12-16 request ceiling is worth far more than connection reuse — but it is
    # a real regression for a single-replica deployment, and if you never intend
    # to scale, keeping the block below and reverting the conf.d change is the
    # better trade. Both halves are commented so the choice stays visible.
    #
    # The block is KEPT, unused by the default configuration, so that reverting
    # is a one-line change in conf.d rather than an archaeology exercise.
    upstream boursenegar {
        server web:8000 max_fails=3 fail_timeout=15s;
        keepalive 32;
        keepalive_timeout 60s;
        keepalive_requests 1000;
    }

    include /etc/nginx/conf.d/*.conf;
}

# snippets/proxy.conf — everything needed to proxy to Gunicorn correctly.
# Included by every location that forwards to the app, so the header set can
# never drift between them.

proxy_http_version 1.1;

# Host must be the ORIGINAL host, not the upstream name, or Flask's url_for()
# would build links pointing at "web:8000".
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# $scheme is what the CLIENT used. This is the header ProxyFix reads in app.py
# to know the request arrived over TLS — without it Flask would issue http://
# redirects and refuse to set the Secure session cookie.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# $request_id is a unique 32-hex value nginx generates per request. Passing it
# through means the id in nginx's access log and the id in every application log
# record are the SAME string, so one grep follows a request from the edge into
# the worker. observability.py adopts it; Flask returns it as X-Request-ID.
proxy_set_header X-Request-ID      $request_id;

# WebSocket-ready: harmless for ordinary requests (see the map in nginx.conf,
# where an absent Upgrade header yields "close"), and sufficient for a future
# streaming endpoint to work through this proxy unchanged.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Connecting to the upstream is a local socket; 5 s is already generous, and it
# is the same for a page and for a WebSocket, so it belongs here.
proxy_connect_timeout 5s;

# The REQUEST-lifetime settings — read/send timeouts and response buffering —
# are deliberately NOT here. They live in snippets/proxy-web.conf, because the
# WebSocket location needs opposite values for all three, and nginx treats a
# second proxy_read_timeout / proxy_buffering in the same context as a fatal
# "directive is duplicate" error rather than an override. Splitting them is
# what lets both kinds of location share the header set above.

# Do not silently serve a stale/error page from another upstream; there is only
# one, and retrying a non-idempotent POST would be wrong.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;

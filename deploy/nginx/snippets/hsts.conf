# snippets/hsts.conf — REGENERATED AT CONTAINER START. Do not edit by hand.
#
# entrypoint.sh overwrites this file every boot, because whether HSTS is safe
# to send depends on which certificate is actually on the tls volume — which
# is a run-time fact, not a build-time one.
#
# The rule it applies:
#
#   self-signed certificate  ->  no header. Sending HSTS here pins the browser
#                                to HTTPS for a year AND removes the "proceed
#                                anyway" escape hatch, locking you out of your
#                                own site until the pin expires.
#   CA-issued certificate    ->  header on. At this point it is ordinary
#                                transport hardening and should be set.
#
# Override with HSTS_ENABLED in the nginx service's environment:
#   auto (default)  decide from the certificate, as above
#   1               always send it   — only with a trusted certificate
#   0               never send it    — e.g. while migrating domains
# and HSTS_MAX_AGE (default 31536000) to shorten the pin while testing.
#
# This file's committed contents are the safe default, and are what `nginx -t`
# validates at image build time before entrypoint.sh has ever run.

# (no Strict-Transport-Security header — regenerated at start)

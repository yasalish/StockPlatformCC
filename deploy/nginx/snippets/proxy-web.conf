# snippets/proxy-web.conf — settings for ordinary HTTP proxying.
#
# Kept apart from proxy.conf because the WebSocket location needs the opposite
# of every value in this file, and nginx rejects a duplicate directive in the
# same context instead of letting the later one win. Locations therefore
# compose: proxy.conf (always) + this (a normal request) OR the /ws/ overrides.

# Timeouts. A cold analytics scan takes ~14 s against a database whose
# materialized views are missing, so 60 s leaves real headroom while staying
# well below Gunicorn's own 120 s — nginx should never be the first to give up,
# but it must give up eventually.
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# Buffering matters here: /stocks is a ~2.5 MB page. Without it nginx streams
# the response straight through and a client on a slow mobile connection holds
# a Gunicorn thread open for the whole download. With it, nginx accepts the
# response at LAN speed, frees the thread, and drips the bytes out itself.
# The defaults are too small for these pages and would spill to a temp file.
proxy_buffering          on;
proxy_buffer_size        16k;    # headers + first chunk
proxy_buffers            16 32k; # 512 KB in memory before touching disk
proxy_busy_buffers_size  64k;
proxy_max_temp_file_size 64m;

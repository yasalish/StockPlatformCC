# snippets/tls.conf — TLS termination settings.
#
# The certificate itself is NOT baked into the image. It is read from the
# tls volume mounted at /etc/nginx/tls:
#     fullchain.pem   certificate + intermediates
#     privkey.pem     private key (mode 0600)
# entrypoint.sh generates a self-signed pair on first start if none is present,
# so the stack comes up on HTTPS immediately; replace both files with a real
# certificate and `docker compose exec nginx nginx -s reload`.

ssl_certificate     /etc/nginx/tls/fullchain.pem;
ssl_certificate_key /etc/nginx/tls/privkey.pem;

# TLS 1.2 is the floor. 1.0/1.1 are broken and 1.3 alone would lock out older
# Android browsers, which are common on the target audience's devices.
ssl_protocols       TLSv1.2 TLSv1.3;

# Modern AEAD suites only, with ChaCha20 available for phones without AES-NI.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
# Let the client choose: modern clients pick ChaCha20 on mobile and AES-GCM on
# desktop better than a fixed server order can.
ssl_prefer_server_ciphers off;

ssl_session_cache   shared:SSL:10m;   # ~40k sessions
ssl_session_timeout 1d;
ssl_session_tickets off;              # off = forward secrecy without key rotation

# OCSP stapling is deliberately NOT enabled. It requires nginx to reach the
# CA's OCSP responder from the VPS on every refresh; when that fails — likely on
# a filtered network — nginx logs errors and handshakes slow down. Enable it
# together with a `resolver` line only after confirming the responder is
# reachable from Iran.

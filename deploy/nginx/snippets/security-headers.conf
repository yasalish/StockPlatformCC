# snippets/security-headers.conf
#
# `always` matters: without it these headers are attached only to 2xx/3xx
# responses, so an error page would be served without them.

add_header X-Content-Type-Options   "nosniff"                      always;
add_header X-Frame-Options          "SAMEORIGIN"                   always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin"                always;
# The app requests no camera, microphone or location.
add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), payment=()" always;

# HSTS — INTENTIONALLY COMMENTED OUT.
#
# Uncomment ONLY after a certificate from a CA the browser trusts is installed.
# With the self-signed certificate entrypoint.sh generates, a browser that sees
# this header pins the host to HTTPS for a year AND removes the "proceed
# anyway" escape hatch, locking you out of your own site until the pin expires.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content-Security-Policy is not set here. The templates still carry inline
# <script> and style attributes, so any honest policy would need
# 'unsafe-inline', which buys nothing. It belongs with the Vue conversion in
# order 08, where the inline code goes away and a nonce-based policy is real.

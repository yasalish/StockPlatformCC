# snippets/security-headers.conf
#
# `always` matters: without it these headers are attached only to 2xx/3xx
# responses, so an error page would be served without them.

add_header X-Content-Type-Options   "nosniff"                      always;
add_header X-Frame-Options          "SAMEORIGIN"                   always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin"                always;
# The app requests no camera, microphone or location.
add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), payment=()" always;

# HSTS — decided at container start, not here.
#
# This used to be a commented-out add_header with instructions to uncomment it
# once a real certificate was installed. That is a manual step that never gets
# done, and it is guarded by exactly the wrong thing: whether the header is safe
# depends on which certificate is on the tls volume at run time, which a
# committed config file cannot know.
#
# entrypoint.sh now inspects the certificate and regenerates hsts.conf on every
# boot — no header while the certificate is self-signed, header on once it is
# CA-issued. Replacing the two files on the volume and reloading remains the
# entire upgrade path, which is what the entrypoint's own header promises.
# HSTS_ENABLED=1|0 overrides the detection; see snippets/hsts.conf.
include /etc/nginx/snippets/hsts.conf;

# Content-Security-Policy is not set here. The templates still carry inline
# <script> and style attributes, so any honest policy would need
# 'unsafe-inline', which buys nothing. It belongs with the Vue conversion in
# order 08, where the inline code goes away and a nonce-based policy is real.

  <path d="M12 44 L26 30 L36 38 L52 18" fill="none" stroke="#c7ab4d"
        stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="52" cy="18" r="5" fill="#c7ab4d"/>
</svg>

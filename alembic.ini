# alembic.ini — migration tooling for «بورس‌نگار».
#
# The database URL is NOT here. It is assembled in migrations/env.py from the
# same STOCK_DB_* environment variables db.py uses, so there is one definition
# of where the database is and no credential in a committed file.

[alembic]
script_location = migrations
prepend_sys_path = .

# Revision filenames sort chronologically and read as a changelog.
file_template = %%(rev)s_%%(slug)s
timezone = Asia/Tehran

# Alembic 1.13 warns without this; we want the modern behaviour.
recursive_version_locations = false
sqlalchemy.url =

[post_write_hooks]

# ---------------------------------------------------------------------------
# Logging. Alembic's own output goes through the standard logging config; the
# application's structured JSON logging (observability.py) is separate — a
# migration runs before the app exists.
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
